<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluetoo AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Aluetoo AI</h2>
                <button class="btn-new-chat">+ Nouvelle conversation</button>
            </div>
            <div class="sidebar-content">
                <p class="sidebar-label">Historique</p>
                <div class="chat-history">
                    </div>
            </div>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <button class="menu-toggle">☰</button>
                <h1>Aluetoo AI</h1>
                <div class="header-options">
                    <select>
                        <option>Aluetoo Flash</option>
                        <option>Aluetoo Pro</option>
                    </select>
                    <button>Theme: Auto</button>
                </div>
            </header>

            <div class="chat-messages">
                <div class="welcome-message">
                    <h2>Bonjour, comment puis-je vous aider ?</h2>
                </div>
                <div class="suggestions">
                    <button class="suggestion-card"><strong>Planifier</strong> Etapes simples et efficaces</button>
                    <button class="suggestion-card"><strong>Chercher</strong> Infos recentes et references</button>
                    <button class="suggestion-card"><strong>Ameliorer</strong> Texte plus propre et plus fluide</button>
                    <button class="suggestion-card"><strong>Creer</strong> Inspiration rapide et utile</button>
                </div>
            </div>

            <footer class="chat-footer">
                <div class="input-container">
                    <button class="btn-action">+</button>
                    <textarea placeholder="Envie un message a "></textarea>
                    <button class="btn-action">Mic</button>
                    <button class="btn-send">↑</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
